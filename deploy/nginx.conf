server {
    listen 80;
    listen [::]:80;
    server_name mirea-racing.sayaka.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    # The server's public 443 is an SNI stream router forwarding PROXY protocol.
    listen 127.0.0.1:9458 ssl proxy_protocol;
    server_name mirea-racing.sayaka.ru;
    ssl_certificate /etc/letsencrypt/live/mirea-racing.sayaka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirea-racing.sayaka.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hill_rivals_SSL:1m;
    ssl_session_tickets off;
    location = /github-webhook {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3108;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_read_timeout 90s;
    }
}
